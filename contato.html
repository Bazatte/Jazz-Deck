<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato | Jazz Deck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container">
      <a class="logo" href="index.html">Jazz Deck</a>
      <nav>
        <ul class="menu">
          <li><a href="contato.html" aria-current="page">Contato</a></li>
          <li><a href="equipe.html" aria-current="page">Equipe</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1 class="titulo-pagina">Contato</h1>
      <p class="subtitulo-pagina">Escreva sua mensagem para a equipe.</p>

      <form class="form-contato" action="#" method="post">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" placeholder="Digite aqui..." required></textarea>
        <button type="submit">Enviar</button>
      </form>
    </div>
  </main>

  <footer class="rodape">
    <p>&copy; Jazz Deck - 2026</p>
  </footer>

</body>
</html>
